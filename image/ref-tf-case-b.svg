</defs>
<rect x="0.0" y="0.0" width="1640.0" height="960.0" rx="0" fill="#f2f2f7" stroke="none" stroke-width="0"/>
<text x="24.0" y="46.0" font-size="26" font-weight="700" fill="#1c1c1e" text-anchor="start">B 구성 — publish_tf: false · ekf_node 가 TF 를 낸다</text>
<text x="24.0" y="72.0" font-size="13" font-weight="400" fill="#636366" text-anchor="start">브리지는 센서 토픽만 낸다. ekf_node 가 /odom 의 속도와 IMU 의 각속도를 받아 융합하고, 그 결과를 TF(odom → base_footprint)로 낸다.</text>
<rect x="16.0" y="92.0" width="1608.0" height="700.0" rx="14" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.0"/>
<rect x="16.0" y="92.0" width="8.0" height="700.0" rx="4" fill="#248a3d" stroke="#248a3d" stroke-width="1.0"/>
<text x="40.0" y="124.0" font-size="18" font-weight="700" fill="#248a3d" text-anchor="start">노드 · 토픽 · TF</text>
<text x="40.0" y="146.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">상자는 노드, 파란 화살표는 토픽(센서 값), 주황 화살표는 TF(두 프레임 사이 위치 · 자세)다. 빨간 표시가 이 구성에서 odom → base_footprint 를 내는 곳이다.</text>
<rect x="60.0" y="200.0" width="260.0" height="74.0" rx="10" fill="#fafafc" stroke="#3a3a3c" stroke-width="1.8"/>
<text x="190.0" y="228.0" font-size="15" font-weight="700" fill="#3a3a3c" text-anchor="middle" font-family="Menlo, Consolas, monospace">rplidar_ros</text>
<text x="190.0" y="250.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">라이다 드라이버 (07)</text>
<rect x="60.0" y="340.0" width="260.0" height="96.0" rx="10" fill="#fafafc" stroke="#3a3a3c" stroke-width="1.8"/>
<text x="190.0" y="368.0" font-size="15" font-weight="700" fill="#3a3a3c" text-anchor="middle" font-family="Menlo, Consolas, monospace">mcu_bridge</text>
<text x="190.0" y="390.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">MCU 프레임 → 토픽 (06)</text>
<text x="190.0" y="409.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle" font-family="Menlo, Consolas, monospace">publish_tf: false</text>
<rect x="60.0" y="506.0" width="260.0" height="74.0" rx="10" fill="#fafafc" stroke="#3a3a3c" stroke-width="1.8"/>
<text x="190.0" y="534.0" font-size="15" font-weight="700" fill="#3a3a3c" text-anchor="middle" font-family="Menlo, Consolas, monospace">robot_state_publisher</text>
<text x="190.0" y="556.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">URDF 를 읽는다 (05)</text>
<rect x="700.0" y="194.0" width="270.0" height="86.0" rx="10" fill="#f2faf4" stroke="#248a3d" stroke-width="1.8"/>
<text x="835.0" y="222.0" font-size="15" font-weight="700" fill="#248a3d" text-anchor="middle" font-family="Menlo, Consolas, monospace">slam_toolbox · AMCL</text>
<text x="835.0" y="244.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">스캔을 지도와 맞춘다 (09)</text>
<text x="835.0" y="263.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">TF 를 내고, TF 를 조회한다</text>
<rect x="700.0" y="340.0" width="270.0" height="96.0" rx="10" fill="#fff4e5" stroke="#b25000" stroke-width="3"/>
<text x="835.0" y="368.0" font-size="15" font-weight="700" fill="#b25000" text-anchor="middle" font-family="Menlo, Consolas, monospace">ekf_node</text>
<text x="835.0" y="390.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">robot_localization (06 §3-10)</text>
<text x="835.0" y="409.0" font-size="12.5" font-weight="700" fill="#b25000" text-anchor="middle">바퀴 속도 + 자이로 융합</text>
<rect x="710.0" y="315.0" width="74.8" height="22.0" rx="11" fill="#e5352b" stroke="#e5352b" stroke-width="1"/>
<text x="747.4" y="331.0" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">TF 발행</text>
<rect x="1330.0" y="506.0" width="250.0" height="74.0" rx="10" fill="#f8f2fb" stroke="#8944ab" stroke-width="1.8"/>
<text x="1455.0" y="534.0" font-size="15" font-weight="700" fill="#8944ab" text-anchor="middle" font-family="Menlo, Consolas, monospace">Nav2 · Foxglove</text>
<text x="1455.0" y="556.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="middle">TF 로 좌표를 바꿔 쓴다</text>
<path d="M970,214 H1100 V648" fill="none" stroke="#ff9500" stroke-width="3" marker-end="url(#aff9500)" stroke-linejoin="round"/>
<text x="1116.0" y="300.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">map → odom</text>
<text x="1116.0" y="320.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">쌓인 드리프트를 되돌리는 보정</text>
<path d="M320.0,237.0 L698.0,237.0" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#a007aff)" stroke-linejoin="round"/>
<text x="340.0" y="228.0" font-size="13.5" font-weight="700" fill="#007aff" text-anchor="start" font-family="Menlo, Consolas, monospace">/scan</text>
<text x="340.0" y="256.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">각도마다 거리 · laser_link 기준</text>
<path d="M320.0,365.0 L698.0,365.0" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#a007aff)" stroke-linejoin="round"/>
<path d="M320.0,415.0 L698.0,415.0" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#a007aff)" stroke-linejoin="round"/>
<text x="340.0" y="356.0" font-size="13.5" font-weight="700" fill="#007aff" text-anchor="start" font-family="Menlo, Consolas, monospace">/odom</text>
<text x="400.0" y="356.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">바퀴로 낸 위치 · 속도 → 속도만 쓴다</text>
<text x="340.0" y="406.0" font-size="13.5" font-weight="700" fill="#007aff" text-anchor="start" font-family="Menlo, Consolas, monospace">/imu/data_raw</text>
<text x="470.0" y="406.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">각속도 → vyaw 만 쓴다</text>
<path d="M190.0,580.0 L190.0,648.0" fill="none" stroke="#ff9500" stroke-width="3" marker-end="url(#aff9500)" stroke-linejoin="round"/>
<text x="206.0" y="612.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">base_footprint → base_link → laser_link · imu_link</text>
<text x="206.0" y="632.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">장착 위치 (고정, /tf_static)</text>
<path d="M835.0,436.0 L835.0,648.0" fill="none" stroke="#e5352b" stroke-width="4.5" marker-end="url(#ae5352b)" stroke-linejoin="round"/>
<text x="852.0" y="520.0" font-size="14" font-weight="700" fill="#e5352b" text-anchor="start" font-family="Menlo, Consolas, monospace">odom → base_footprint</text>
<text x="852.0" y="540.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">ekf_node 가 낸다</text>
<text x="852.0" y="558.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">융합해 적분한 위치 · 방향</text>
<path d="M1040,650 V262 H972" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a8e8e93)" stroke-linejoin="round"/>
<text x="1030.0" y="600.0" font-size="12" font-weight="400" fill="#636366" text-anchor="end">조회: 스캔 순간의</text>
<text x="1030.0" y="618.0" font-size="12" font-weight="400" fill="#636366" text-anchor="end">라이다 위치</text>
<path d="M1455.0,650.0 L1455.0,582.0" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a8e8e93)" stroke-linejoin="round"/>
<line x1="60" y1="660" x2="1580" y2="660" stroke="#ff9500" stroke-width="10" stroke-linecap="round"/>
<text x="60.0" y="696.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">/tf · /tf_static</text>
<text x="200.0" y="696.0" font-size="12.5" font-weight="400" fill="#1c1c1e" text-anchor="start">TF 가 모이는 토픽. 받는 노드마다 tf2 버퍼가 연결들을 모아 이어 붙인다. 받는 쪽은 누가 냈는지 구별하지 않는다.</text>
<rect x="60.0" y="719.0" width="34.0" height="18.0" rx="5" fill="#fafafc" stroke="#3a3a3c" stroke-width="1.5"/>
<text x="102.0" y="733.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">노드</text>
<path d="M160.0,728.0 L200.0,728.0" fill="none" stroke="#007aff" stroke-width="2.5" marker-end="url(#a007aff)" stroke-linejoin="round"/>
<text x="208.0" y="733.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">토픽</text>
<path d="M270.0,728.0 L310.0,728.0" fill="none" stroke="#ff9500" stroke-width="3" marker-end="url(#aff9500)" stroke-linejoin="round"/>
<text x="318.0" y="733.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">TF 발행</text>
<path d="M400.0,728.0 L440.0,728.0" fill="none" stroke="#e5352b" stroke-width="4.5" marker-end="url(#ae5352b)" stroke-linejoin="round"/>
<text x="448.0" y="733.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">이 구성의 odom → base_footprint</text>
<path d="M660.0,728.0 L700.0,728.0" fill="none" stroke="#8e8e93" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a8e8e93)" stroke-linejoin="round"/>
<text x="708.0" y="733.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">TF 조회</text>
<rect x="16.0" y="808.0" width="1608.0" height="130.0" rx="14" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.0"/>
<rect x="16.0" y="808.0" width="8.0" height="130.0" rx="4" fill="#8944ab" stroke="#8944ab" stroke-width="1.0"/>
<text x="40.0" y="840.0" font-size="18" font-weight="700" fill="#8944ab" text-anchor="start">TF 를 내는 위치는 고정이 아니다</text>
<text x="40.0" y="862.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">규칙은 하나 — 같은 연결은 한 노드만 낸다. 그 안에서 어느 노드가 낼지는 개발자가 정한다. 받는 노드(SLAM · Nav2)는 바뀌지 않는다.</text>
<text x="40.0" y="894.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">· 다른 구성 — A 구성: ekf_node 없이 mcu_bridge 가 TF 를 직접 낸다 (ref-tf-case-a)</text>
<text x="40.0" y="916.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">· 그 밖의 구성도 같은 규칙 안에서 만들 수 있다 — 예: 브리지 안에서 자이로로 방향을 직접 융합해 내기, 센서를 더해 ekf.yaml 에 입력 추가</text>
</svg>
