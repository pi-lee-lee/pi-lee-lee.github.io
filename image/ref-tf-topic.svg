</g>
<text x="120.0" y="736.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">map</text>
<text x="232.0" y="630.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">odom</text>
<text x="906.0" y="488.0" font-size="13" font-weight="700" fill="#b25000" text-anchor="start">30°</text>
<text x="716.0" y="396.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="end" font-family="Menlo, Consolas, monospace">base_footprint · base_link</text>
<text x="716.0" y="415.0" font-size="12" font-weight="400" fill="#636366" text-anchor="end">차량 기준점 = 로봇 중심. 차량의 위치 · 방향은 이 점과 이 축이다</text>
<text x="716.0" y="432.0" font-size="12" font-weight="400" fill="#636366" text-anchor="end">(둘은 같은 점, 높이만 다르다 — 바닥 · 몸체)</text>
<text x="196.0" y="754.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">① map → odom</text>
<text x="196.0" y="772.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">이동 (x₁, y₁) · 회전 0° — slam_toolbox · AMCL</text>
<text x="470.0" y="628.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start" font-family="Menlo, Consolas, monospace">② odom → base_footprint</text>
<text x="470.0" y="646.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">이동 (x₂, y₂) · 회전 30° — A 구성은 mcu_bridge, B 구성은 ekf_node</text>
<text x="1000.0" y="458.0" font-size="13.5" font-weight="700" fill="#007aff" text-anchor="start" font-family="Menlo, Consolas, monospace">/scan</text>
<text x="1058.0" y="458.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">이 각도에서 거리 d</text>
<text x="1000.0" y="478.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">laser_link 기준의 센서 값 — TF 가 아니다</text>
<text x="1150.0" y="326.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">장애물의 한 점</text>
<text x="1150.0" y="346.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">이 점이 map 의 어디인가?</text>
<path d="M905.0,538.0 L1196.0,550.0" fill="none" stroke="#8e8e93" stroke-width="1.2" stroke-dasharray="5 4" stroke-linejoin="round"/>
<rect x="1196.0" y="510.0" width="372.0" height="246.0" rx="10" fill="#ffffff" stroke="#c7c7cc" stroke-width="1.2"/>
<text x="1210.0" y="534.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">로봇 안의 TF — 확대 (로봇 축 기준)</text>
<rect x="1266.0" y="580.0" width="160.0" height="92.0" rx="14" fill="#e5e5ea" stroke="#636366" stroke-width="1.6"/>
<path d="M1346.0,626.0 L1390.0,626.0" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#adc2626)" stroke-linejoin="round"/>
<path d="M1346.0,626.0 L1346.0,592.0" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a16a34a)" stroke-linejoin="round"/>
<circle cx="1408" cy="626" r="14" fill="#3a3a3c"/><circle cx="1408" cy="626" r="5" fill="#64d2ff"/>
<path d="M1352.0,636.0 L1404.0,636.0" fill="none" stroke="#ff9500" stroke-width="4" marker-end="url(#aff9500)" stroke-linejoin="round"/>
<rect x="1297" y="645" width="18" height="14" rx="3" fill="#8e8e93"/>
<path d="M1342.0,630.0 L1312.0,646.0" fill="none" stroke="#ff9500" stroke-width="3" marker-end="url(#aff9500)" stroke-linejoin="round"/>
<circle cx="1346" cy="626" r="6" fill="#1c1c1e" stroke="#fff" stroke-width="2"/>
<text x="1346.0" y="570.0" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle" font-family="Menlo, Consolas, monospace">base_link</text>
<text x="1428.0" y="616.0" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="start" font-family="Menlo, Consolas, monospace">laser_link</text>
<text x="1306.0" y="692.0" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle" font-family="Menlo, Consolas, monospace">imu_link</text>
<text x="1210.0" y="722.0" font-size="12" font-weight="700" fill="#b25000" text-anchor="start">③ base_link → laser_link : 이동 (앞으로 a, 0) · 회전 0°</text>
<text x="1210.0" y="742.0" font-size="12" font-weight="400" fill="#636366" text-anchor="start">robot_state_publisher 가 URDF 의 장착 위치로 낸다 (고정)</text>
<text x="40" y="804" font-size="15" font-weight="700" font-family="Menlo, Consolas, monospace"><tspan fill="#1c1c1e">map 기준 점 = </tspan><tspan fill="#b25000">① map→odom</tspan><tspan fill="#8e8e93">  ×  </tspan><tspan fill="#b25000">② odom→base_footprint</tspan><tspan fill="#8e8e93">  ×  </tspan><tspan fill="#b25000">(base_footprint→base_link)</tspan><tspan fill="#8e8e93">  ×  </tspan><tspan fill="#b25000">③ base_link→laser_link</tspan><tspan fill="#8e8e93">  ×  </tspan><tspan fill="#007aff">/scan 의 점</tspan></text>
<text x="40.0" y="830.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">주황 넷은 두 원점 사이의 이동 · 회전만 담는다. 센서 값은 파랑 하나(/scan)뿐이다. 노드는 "laser_link 의 점을 map 기준으로" 라고만 요청하고, tf2 가 오른쪽부터 차례로 계산한다.</text>
<rect x="16.0" y="898.0" width="1608.0" height="270.0" rx="14" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.0"/>
<rect x="16.0" y="898.0" width="8.0" height="270.0" rx="4" fill="#3a3a3c" stroke="#3a3a3c" stroke-width="1.0"/>
<text x="40.0" y="930.0" font-size="18" font-weight="700" fill="#3a3a3c" text-anchor="start">2  토픽과 TF 의 차이</text>
<text x="40.0" y="952.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">둘 다 토픽으로 전달되지만 담는 것과 다루는 방법이 다르다.</text>
<rect x="32.0" y="972.0" width="1576.0" height="32.0" rx="6" fill="#f2f2f7" stroke="none" stroke-width="0"/>
<text x="300.0" y="994.0" font-size="13.5" font-weight="700" fill="#007aff" text-anchor="start">토픽</text>
<text x="960.0" y="994.0" font-size="13.5" font-weight="700" fill="#b25000" text-anchor="start">TF</text>
<path d="M32.0,1007.0 L1608.0,1007.0" fill="none" stroke="#e5e5ea" stroke-width="1" stroke-linejoin="round"/>
<text x="40.0" y="1030.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">담는 것</text>
<text x="300.0" y="1030.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">센서 측정값 · 처리 결과 (거리, 각속도, 속도, 공분산)</text>
<text x="960.0" y="1030.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">두 프레임 사이(부모 원점 → 자식 원점)의 이동 · 회전. 센서 값은 없다</text>
<path d="M32.0,1041.0 L1608.0,1041.0" fill="none" stroke="#e5e5ea" stroke-width="1" stroke-linejoin="round"/>
<text x="40.0" y="1064.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">frame_id 의 뜻</text>
<text x="300.0" y="1064.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">이 값이 어느 프레임 기준인지 적은 표시</text>
<text x="960.0" y="1064.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">부모 → 자식. 연결 그 자체</text>
<path d="M32.0,1075.0 L1608.0,1075.0" fill="none" stroke="#e5e5ea" stroke-width="1" stroke-linejoin="round"/>
<text x="40.0" y="1098.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">발행</text>
<text x="300.0" y="1098.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">센서 노드 · 처리 노드가 토픽마다</text>
<text x="960.0" y="1098.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">연결마다 한 노드. 어느 노드가 낼지는 구성에 따라 다르다</text>
<path d="M32.0,1109.0 L1608.0,1109.0" fill="none" stroke="#e5e5ea" stroke-width="1" stroke-linejoin="round"/>
<text x="40.0" y="1132.0" font-size="13" font-weight="700" fill="#1c1c1e" text-anchor="start">융합</text>
<text x="300.0" y="1132.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">처리 노드(ekf_node)가 토픽을 받아 계산한다</text>
<text x="960.0" y="1132.0" font-size="13" font-weight="400" fill="#1c1c1e" text-anchor="start">하지 않는다. 계산이 끝난 결과만 싣는다</text>
</svg>
