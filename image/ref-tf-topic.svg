<line x1="170" y1="1250" x2="170" y2="1180" stroke="#16a34a" stroke-width="3" marker-end="url(#a16a34a)"/>
<line x1="280" y1="1185" x2="350" y2="1185" stroke="#dc2626" stroke-width="3" marker-end="url(#adc2626)"/>
<line x1="280" y1="1185" x2="280" y2="1115" stroke="#16a34a" stroke-width="3" marker-end="url(#a16a34a)"/>
