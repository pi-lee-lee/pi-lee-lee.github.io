<rect x="0.0" y="0.0" width="1640.0" height="1180.0" rx="0" fill="#f2f2f7" stroke="none" stroke-width="0"/>
<text x="24.0" y="46.0" font-size="26" font-weight="700" fill="#1c1c1e" text-anchor="start">TF 를 이어 붙여 라이다 한 점의 위치를 구한다</text>
<text x="24.0" y="72.0" font-size="13" font-weight="400" fill="#636366" text-anchor="start">센서 값은 /scan 하나뿐이고, 나머지는 TF 연결이다. tf2 가 연결들을 차례로 적용해 laser_link 기준의 점을 map 기준으로 바꾼다.</text>
<rect x="16.0" y="92.0" width="1608.0" height="790.0" rx="14" fill="#ffffff" stroke="#d1d1d6" stroke-width="1.0"/>
<rect x="16.0" y="92.0" width="8.0" height="790.0" rx="4" fill="#b25000" stroke="#b25000" stroke-width="1.0"/>
<text x="40.0" y="124.0" font-size="18" font-weight="700" fill="#b25000" text-anchor="start">1  위에서 내려다본 방</text>
<text x="40.0" y="146.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">점(●)은 프레임의 원점, 빨강 축 = x(앞), 초록 축 = y(왼쪽)이다. 주황 화살표 하나가 TF 하나 — 두 원점 사이의 값이다.</text>
<rect x="40.0" y="166.0" width="1560.0" height="76.0" rx="10" fill="#fff8ee" stroke="#ffd8a8" stroke-width="1"/>
<circle cx="92" cy="204" r="7" fill="#1c1c1e"/>
<text x="92.0" y="230.0" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">부모 원점</text>
<path d="M100.0,204.0 L330.0,204.0" fill="none" stroke="#ff9500" stroke-width="5" marker-end="url(#aff9500)" stroke-linejoin="round"/>
<text x="215.0" y="192.0" font-size="13" font-weight="700" fill="#b25000" text-anchor="middle">이동 (x, y, z)</text>
<circle cx="340" cy="204" r="7" fill="#1c1c1e"/>
<text x="340.0" y="230.0" font-size="12" font-weight="700" fill="#1c1c1e" text-anchor="middle">자식 원점</text>
<path d="M340.0,204.0 L400.0,204.0" fill="none" stroke="#8e8e93" stroke-width="1.5" stroke-dasharray="4 3" stroke-linejoin="round"/>
<path d="M340.0,204.0 L392.0,174.0" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#adc2626)" stroke-linejoin="round"/>
<path d="M378,204 A38,38 0 0 0 372.9,185" fill="none" stroke="#b25000" stroke-width="2"/>
<text x="408.0" y="190.0" font-size="13" font-weight="700" fill="#b25000" text-anchor="start">회전 θ</text>
<text x="470.0" y="198.0" font-size="14" font-weight="700" fill="#1c1c1e" text-anchor="start">TF 하나는 점 하나가 아니라 두 프레임 사이(부모 원점 → 자식 원점)의 값이다.</text>
<text x="470.0" y="220.0" font-size="12.5" font-weight="400" fill="#636366" text-anchor="start">담는 것은 둘뿐이다 — 자식 원점이 부모 원점에서 얼마나 떨어져 있는가(이동), 자식 축이 부모 축에서 얼마나 돌아 있는가(회전).</text>
